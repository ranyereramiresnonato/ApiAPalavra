name: CI - Sonar & Docker Check

on:
  pull_request:
    branches:
      - main

jobs:
  sonar-and-docker:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Pega o código do PR
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Build da imagem Docker (só pra garantir que o Dockerfile não quebra)
      - name: Build Docker image
        run: docker build -t apiapalavra-test ./ApiAPalavra

      # 3️⃣ Instala .NET e SonarScanner no runner
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner
          
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"seu-projeto-key" \
            /o:"sua-organizacao" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.pullrequest.key=${{ github.event.pull_request.number }} \
            /d:sonar.pullrequest.branch=${{ github.head_ref }} \
            /d:sonar.pullrequest.base=${{ github.base_ref }}

          dotnet build ./ApiAPalavra --no-restore --configuration Release

          dotnet sonarscanner end /d:sonar.login=${{ secrets.SONAR_TOKEN }}
