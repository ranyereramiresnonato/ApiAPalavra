name: CI - PR Analysis

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Pega o código do PR
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Configura o .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      # 3️⃣ Restore das dependências
      - name: Restore dependencies
        run: dotnet restore

      # 4️⃣ Rodar análise do SonarCloud
      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet tool install --global dotnet-sonarscanner
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet sonarscanner begin \
            /k:"seu-projeto-key" \
            /o:"sua-organizacao" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.pullrequest.key=${{ github.event.pull_request.number }} \
            /d:sonar.pullrequest.branch=${{ github.head_ref }} \
            /d:sonar.pullrequest.base=${{ github.base_ref }}

          # 5️⃣ Build do projeto
          dotnet build --no-restore --configuration Release

          # 6️⃣ Finaliza análise do SonarCloud
          dotnet sonarscanner end /d:sonar.login=${{ secrets.SONAR_TOKEN }}
